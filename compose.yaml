services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: minidispatch_layered
      POSTGRES_USER: dispatch_user
      POSTGRES_PASSWORD: dispatch_local_123
    ports:
      - "55475:5432"
    volumes:
      - dispatch_layered_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch_user -d minidispatch_layered"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dispatch_layered_data: